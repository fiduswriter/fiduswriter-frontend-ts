allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  es5-ext: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@fiduswriter/bibliography-manager@0.1.34'
  - '@fiduswriter/document@0.3.17'
  - '@fiduswriter/editor@0.2.28 || 0.2.30 || 0.2.32 || 0.2.33'
  - paged-with-floats@0.11.0
  - pages-to-pdf@0.3.10
  - lingotweaker-data@0.2.3
  - lingotweaker-wasm@0.2.3
overrides:
  test-exclude: ^8.0.0
  '@babel/polyfill': '-'
  '@xmldom/xmldom': 0.9.12
  'glob@^10.5.0': ^13.0.6
